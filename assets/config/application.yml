server:
  http2:
    enabled: true
  servlet:
    context-path: /
  session-timeout: 1
  tomcat:
    max-connections: 20000
    max-threads: 1000
    uri-encoding: UTF-8
spring:
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: true
  mvc:
    favicon:
      enabled: false
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
    throw-exception-if-no-handler-found: true
  resources:
    add-mappings: false
  servlet:
    multipart:
      enabled: true
      location: ${user.dir}/__tmp__/${spring.application.name}
      max-file-size: 5MB
      max-request-size: 10MB
  liquibase:
    change-log: classpath:liquibase/master.xml
    enabled: true